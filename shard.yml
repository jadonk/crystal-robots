name: crystal-robots
version: 0.0.1
description: |
  Start to learn the Crystal Programming Language by creating robots that battle on a virtual field using a toy compiler that runs in your browser.

documentation: https://jkridner.beagleboard.io/crystal-robots
homepage: https://openbeagle.org/jkridner/crystal-robots

authors:
  - Jason Kridner <jkridner@beagleboard.org>

targets:
  crystal-robots:
    main: src/crystal-robots.cr
  examples-rabbit:
    main: src/examples/rabbit.cr

crystal: '>= 1.8.0'

license: GPLv2
