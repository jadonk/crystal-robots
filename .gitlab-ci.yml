image: $CI_REGISTRY/jkridner/crystal
build:
  stage: build
  before-script:
    - apk add shards
  script:
    - shards build
  artifacts:
    paths:
      - bin/crystal-robots
      - bin/examples-rabbit

test:
  stage: test
  before_script:
    - curl https://get.wasmer.io -sSfL | sh
    - . $HOME/.wasmer/wasmer.sh
    - shards install
  script:
    - crystal spec
    - crystal tool format --check
    - bin/crystal-robots -v
    - bin/crystal-robots
    - bin/examples-rabbit

pages:
  stage: deploy
  script:
    - git config --global --add safe.directory /builds/jkridner/crystal-robots
    - crystal docs -o public --project-version `git show --format=%h -s` src/crystal-robots.cr lib/crystal-robots/src/crystal-robots.cr
  artifacts:
    paths:
      - public
