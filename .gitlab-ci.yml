image: $CI_REGISTRY/jkridner/crystal
build:
  stage: build
  script:
    - crystal build src/crystal-robots.cr
    - crystal build src/examples/rabbit.cr
  artifacts:
    paths:
      - crystal-robots
      - rabbit

test:
  stage: test
  script:
    - crystal spec

pages:
  stage: deploy
  script:
    - git config --global --add safe.directory /builds/jkridner/crystal-robots
    - crystal docs --project-name crystal-robots --project-version `git show --format=%h -s`
    - mv docs public
  artifacts:
    paths:
      - public
