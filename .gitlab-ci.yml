image: $CI_REGISTRY/jkridner/crystal
build:
  stage: build
  script:
    - crystal build src/crystal-robots.cr
    - crystal build src/rabbit.cr
  artifacts:
    paths:
      - crystal-robots
      - rabbit

test:
  stage: test
  script:
    - crystal spec

pages:
  stage: deploy
  script:
    - crystal docs
    - mv docs public
  artifacts:
    paths:
      - public
