# Publishes the Phase 5b browser compiler and battle (crystal-robots.wasm
# plus the static page in site/) to GitHub Pages at
# https://jadonk.github.io/crystal-robots/.
#
# The GitHub repository is a read-only mirror: trunk is developed on
# Fossil and pushed here through a Forgejo push mirror (see docs/PLAN.md,
# Phase 7). This workflow only reacts to that mirrored history landing on
# `main` or `dev`; it does not build anything ci.cr does not already build --
# `crystal run ci.cr -- --with-wasm32` is the one command, so a developer
# running it locally sees exactly what this workflow publishes, including
# `site/robots.json` (the battle page's example-robot picker, Phase 5b-2),
# which is a step inside ci.cr under `--with-wasm32`, not a separate
# workflow step.
# Fossil trunk lands on the mirror's `dev` branch, not `main`.
name: Deploy browser compiler to GitHub Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oprypin/install-crystal@v1
        with:
          crystal: "1.18.2"

      - run: sudo apt-get update && sudo apt-get install -y lld libyaml-dev

      - run: crystal run ci.cr -- --with-wasm32

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
