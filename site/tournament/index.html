<main class="site-shell activity"><h1>Tournament</h1><p class="lede">Choose 3 to 8 robots. Every pool fight earns a point for its winner; the top robots enter a best of three bracket.</p>

<section id="results" hidden><h2>Pools</h2><div id="pools"></div><h2>Bracket</h2><div id="bracket" class="bracket"></div><h2>Champion</h2><p id="champion" class="champion"></p></section>
<section id="replay-section" hidden><h2>Fight replay</h2><p id="replay-result" role="status"></p><div id="replay" class="replay"></div></section></main><script type="module" src="./tournament.js"></script></body></html>
