    "c-a-7": {
      "summary": "Robots can compare values and repeat steps.",
      "excerpts": [
        {
          "file": "src/compiler/wasm_emitter.cr",
          "anchor": "code = op(Opcodes::Block)",
          "through": "code += op(Opcodes::Br) + WASM_Emitter.unsignedLEB128(0)",
          "note": "[[WebAssembly|#word-webassembly]] has no `while`. It has a block you can jump out of and a loop you can jump back to, so the compiler uses both: check the condition, leave when the work is done, otherwise run the body and return to the top.",
          "line_notes": {
            "code += op(Opcodes::I32_eqz)": "`while` keeps going while its test is true, so this flips the answer: now true means it is time to leave.",
            "code += op(Opcodes::Br_if)": "Leave the outer block if the test says the loop is done.",
            "code += op(Opcodes::Br) +": "Jump back to the top of the loop and check again."
          }
        }
      ]
